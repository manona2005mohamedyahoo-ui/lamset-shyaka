kind = "mobile"
previewPath = "/lamset-mobile/"
title = "تطبيق لمسة شياكة"
description = "تطبيق لمسة شياكة العربي لأندرويد وآيفون للزبائن وصاحبة المتجر بصلاحيات منفصلة وبنفس بيانات المتجر."
version = "1.0.0"
id = "artifacts/lamset-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/lamset-mobile/" ]
localPort = 23994

[services.development]
run = "pnpm --filter @workspace/lamset-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lamset-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lamset-mobile", "run", "serve" ]

[services.env]
PORT = "23994"
BASE_PATH = "/lamset-mobile/"
