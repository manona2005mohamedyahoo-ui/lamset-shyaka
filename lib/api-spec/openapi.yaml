openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /mobile/store:
    get:
      operationId: getMobileStore
      responses:
        "200":
          description: Public store configuration, not privileged access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileStore"
  /mobile/products:
    get:
      operationId: getMobileProducts
      responses:
        "200":
          description: Published Shopify products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MobileProduct"
  /mobile/products/{handle}:
    get:
      operationId: getMobileProduct
      parameters:
        - in: path
          name: handle
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileProduct"
  /mobile/checkout:
    post:
      operationId: createMobileCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileCartInput"
      responses:
        "200":
          description: Shopify cart and hosted checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileCheckout"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    MobileStore:
      type: object
      required: [name, managementUrl]
      properties:
        name: { type: string }
        managementUrl: { type: string }
    MobileImage:
      type: object
      required: [url, alt]
      properties:
        url: { type: string }
        alt: { type: string }
    MobileOption:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    MobileVariant:
      type: object
      required: [id, title, available, price, currency, options]
      properties:
        id: { type: string }
        title: { type: string }
        available: { type: boolean }
        price: { type: string }
        currency: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/MobileOption" }
    MobileProduct:
      type: object
      required: [id, handle, title, description, category, tags, images, variants]
      properties:
        id: { type: string }
        handle: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/MobileImage" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/MobileVariant" }
    MobileLineInput:
      type: object
      required: [merchandiseId, quantity]
      properties:
        merchandiseId: { type: string, pattern: "^gid://shopify/ProductVariant/[0-9]+$" }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    MobileCartInput:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/MobileLineInput" }
    MobileCheckout:
      type: object
      required: [checkoutUrl, subtotal, currency]
      properties:
        checkoutUrl: { type: string }
        subtotal: { type: string }
        currency: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

